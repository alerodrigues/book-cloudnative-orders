server:
  port: 8082
  shutdown: graceful
  netty:
    connection-timeout: 2s
    idle-timeout: 15s

spring:
  application:
    name: book-cloudnative-orders

  r2dbc:
    name: cloudnative
    username: root
    password: root
    url: r2dbc:mariadb://localhost:3306/cloudnative

  config:
    import: "optional:configserver:"

  cloud:
    config:
      uri: http://localhost:8088
      request-connect-timeout: 5000
      request-read-timeout: 5000
      fail-fast: false

    function:
      definition: dispatch
    stream:
      bindings:
        dispatch-in-0:
          destination: order-labeled
          group: ${spring.application.name}
        accepted-out-0:
          destination: order-accepted

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

polar:
  catalog-service-uri: "http://localhost:8081"